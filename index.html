<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">GameVault</div>
    <div class="search-bar">
      <input type="text" placeholder="Search games across stores...">
    </div>
    <div>
      <a href="login.html" style="color: var(--text-muted); text-decoration: none;">Logout</a>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <h3>My Backlog</h3>
      <div class="backlog-item">
        <div class="backlog-info">
          <h4>Cyberpunk 2077</h4>
          <p>Target: $29.99</p>
        </div>
      </div>
      <div class="backlog-item">
        <div class="backlog-info">
          <h4>Elden Ring</h4>
          <p>Target: $39.99</p>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <h2 style="margin-bottom: 20px;">Trending Deals</h2>
      <div class="game-grid">
        <div class="game-card">
          <span class="discount-badge">-50%</span>
          <div class="game-card-header">Game Preview</div>
          <div class="game-details">
            <h4>The Witcher 3</h4>
            <div class="price-row">
              <span style="text-decoration: line-through;">$39.99</span>
              <span class="current-price">$19.99</span>
            </div>
          </div>
        </div>

        <div class="game-card">
          <span class="discount-badge">-33%</span>
          <div class="game-card-header">Game Preview</div>
          <div class="game-details">
            <h4>Hades II</h4>
            <div class="price-row">
              <span style="text-decoration: line-through;">$29.99</span>
              <span class="current-price">$19.99</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
